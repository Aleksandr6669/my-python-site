<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Бункер — Система Отбора</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Бункер">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-dark:#020617; --card-bg:rgba(15,23,42,.72); --card-gloss:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
            --mesh-glow:radial-gradient(circle at 20% 10%,rgba(239,68,68,.16),transparent 30%),radial-gradient(circle at 80% 80%,rgba(59,130,246,.12),transparent 35%);
            --text-main:#f8fafc; --text-muted:#94a3b8; --danger-red:#ef4444; --accent-amber:#f59e0b; --border-color:rgba(255,255,255,.1); --border-glow:0 0 18px rgba(255,255,255,.04);
        }
        *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
        html,body{height:100%;width:100%;overflow:hidden;background:var(--bg-dark);color:var(--text-main);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        .app-wrapper{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;position:relative;background:var(--bg-dark);background-image:var(--mesh-glow);overflow:hidden}
        header{position:absolute;top:0;left:0;right:0;height:calc(54px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);padding-left:14px;padding-right:14px;background:rgba(15,23,42,.75);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;z-index:100}
        .brand-title{font-family:'Orbitron',sans-serif;font-size:1.2rem;color:var(--danger-red);letter-spacing:1.5px;font-weight:900;text-shadow:0 0 12px var(--danger-red);flex-shrink:0;line-height:1}
        .header-actions{display:flex;align-items:center;gap:8px;height:34px;flex-shrink:0}
        .theme-palette-btn{background:rgba(255,255,255,.08);border:1px solid var(--border-color);color:white;border-radius:10px;width:34px;height:34px;font-size:.95rem;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
        .room-badge{font-size:.78rem;background:rgba(255,255,255,.06);color:var(--accent-amber);border:1px solid var(--border-color);padding:0 12px;height:34px;border-radius:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;white-space:nowrap;backdrop-filter:blur(12px);box-shadow:var(--border-glow)}
        main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;margin-top:calc(54px + env(safe-area-inset-top,0px));padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));}
        .card{background:var(--card-bg);background-image:var(--card-gloss);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--border-color);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 12px 32px rgba(0,0,0,.5),var(--border-glow)}
        .card-title{font-family:'Orbitron',sans-serif;font-size:1.05rem;color:var(--accent-amber);margin-bottom:14px;display:flex;align-items:center;gap:10px;font-weight:800}
        .form-group{margin-bottom:14px} label{display:block;margin-bottom:7px;color:var(--text-muted);font-size:.82rem;font-weight:600}
        input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--border-color);border-radius:12px;background:rgba(255,255,255,.06);color:var(--text-main);outline:none} button{font:inherit;cursor:pointer}
        .btn{border:0;border-radius:12px;padding:12px 16px;color:#fff;background:rgba(255,255,255,.08)}
        .btn-primary{background:var(--danger-red)} .btn-amber{background:#b45309}.btn-outline{border:1px solid var(--border-color);background:transparent}
        .tab-panel{display:none}.tab-panel.active{display:block}
        nav.bottom-nav{position:absolute;left:0;right:0;bottom:0;width:100%;height:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;background:rgba(15,23,42,.88);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:1px solid var(--border-color);display:flex;justify-content:space-around;align-items:center;z-index:1000}
        .nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);font-size:.72rem;font-weight:600;cursor:pointer;gap:3px;width:32%;height:44px;border-radius:12px;transition:all .25s cubic-bezier(.4,0,.2,1)}
        .nav-item.active{color:var(--danger-red);background:rgba(239,68,68,.15);box-shadow:inset 0 0 12px rgba(239,68,68,.2)} .nav-item .icon{font-size:1.25rem}.nav-item.active .icon{transform:scale(1.18);color:var(--danger-red)}
        .toast-container{z-index:9999}
        html,body{min-height:100%;min-height:100svh} .app-wrapper{min-height:100svh;height:100dvh;width:100%;max-width:480px}
        @supports not (height:100dvh){.app-wrapper{height:100vh;min-height:100vh}} @media (min-width:481px){.app-wrapper{height:100vh;min-height:100vh}}
    </style>
</head>
<body data-theme="red">
    <div class="app-wrapper">
        <header>
            <div class="brand-title">БУНКЕР</div>
            <div class="header-actions">
                <button class="theme-palette-btn" onclick="openThemeModal()" title="Сменить оформление"><i class="fa-solid fa-palette"></i></button>
                <div class="room-badge" id="headerRoomBadge">Не в игре</div>
            </div>
        </header>
        <main>
            <button id="pwaBtn" class="btn btn-pwa" style="display:none" onclick="installPWA()">📲 Сохранить на главный экран (PWA)</button>
            <div id="authScreen" class="animate__animated animate__fadeIn">
                <div id="authRoomListStep">
                    <div class="card"><div class="card-title"><i class="fa-solid fa-magnifying-glass"></i> Активные Бункеры</div><div id="availableRoomsList"></div><button class="btn btn-primary" onclick="showCreateRoomStep()">Создать новый бункер</button></div>
                </div>
                <div id="createRoomStep" style="display:none"></div>
            </div>
            <div id="gameScreen" style="display:none">
                <section id="panelBunker" class="tab-panel active"></section>
                <section id="panelVote" class="tab-panel"></section>
                <section id="panelAdmin" class="tab-panel"></section>
            </div>
        </main>
        <nav class="bottom-nav" id="bottomNav" style="display:none">
            <div class="nav-item active" onclick="switchTab('panelBunker',this)"><span class="icon"><i class="fa-solid fa-users"></i></span><span>Кандидаты</span></div>
            <div class="nav-item" onclick="switchTab('panelVote',this)"><span class="icon"><i class="fa-solid fa-check-to-slot"></i></span><span>Выбывание</span></div>
            <div class="nav-item" onclick="switchTab('panelAdmin',this)"><span class="icon"><i class="fa-solid fa-sliders"></i></span><span>Управление</span></div>
        </nav>
    </div>
    <script>
        const Toast=Swal.mixin({toast:true,position:'center',showConfirmButton:false,timer:2200,timerProgressBar:true,background:'#1f2937',color:'#fff'});
        function openThemeModal(){Swal.fire({title:'🎨 Выберите Стиль Оформления',html:`<div style="display:flex;flex-direction:column;gap:10px;margin-top:15px"><div onclick="selectThemeModal('red')" style="padding:12px;background:rgba(239,68,68,.15);border:1px solid #ef4444;border-radius:12px;color:white;cursor:pointer">🔴 Красный Бункер</div><div onclick="selectThemeModal('cyan')" style="padding:12px;background:rgba(6,182,212,.15);border:1px solid #06b6d4;border-radius:12px;color:white;cursor:pointer">🔵 Циан Неон</div><div onclick="selectThemeModal('emerald')" style="padding:12px;background:rgba(16,185,129,.15);border:1px solid #10b981;border-radius:12px;color:white;cursor:pointer">🟢 Изумрудный Токсин</div><div onclick="selectThemeModal('amber')" style="padding:12px;background:rgba(245,158,11,.15);border:1px solid #f59e0b;border-radius:12px;color:white;cursor:pointer">🟠 Янтарный</div></div>`,showConfirmButton:false,background:'#111827',color:'#fff'})}
        function selectThemeModal(theme){document.body.dataset.theme=theme;localStorage.setItem('bunker_theme',theme);Swal.close()}
        function switchTab(id,el){document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));const p=document.getElementById(id);if(p)p.classList.add('active');document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active')}
        function showCreateRoomStep(){document.getElementById('authRoomListStep').style.display='none';document.getElementById('createRoomStep').style.display='block'}
        function installPWA(){}
        document.addEventListener('DOMContentLoaded',()=>{const t=localStorage.getItem('bunker_theme');if(t)document.body.dataset.theme=t});
    </script>
</body>
</html>
